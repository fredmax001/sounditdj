version: '3.8'

services:
  sounditdj-backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: sounditdj-backend
    restart: always
    environment:
      - PORT=3001
      - NODE_ENV=production
      # JWT_SECRET and API keys are loaded from ./backend/.env.production
    env_file:
      - ./backend/.env.production
    ports:
      - "3001:3001"
    volumes:
      - /opt/sounditdj/database:/app/database
      - /opt/sounditdj/uploads:/app/uploads
      - /opt/sounditdj/logs:/app/logs
    networks:
      - sounditdj-network

  sounditdj-frontend:
    image: nginx:alpine
    container_name: sounditdj-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - sounditdj-backend
    networks:
      - sounditdj-network

networks:
  sounditdj-network:
    driver: bridge
